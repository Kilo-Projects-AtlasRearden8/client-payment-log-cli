[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-log"
version = "0.1.0"
description = "Local-first CLI for freelancers and small businesses: log client payments, track overdue invoices, and export CSV or PDF summaries."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["invoices", "payments", "bookkeeping", "freelance", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business",
    "Topic :: Other/Nonlisted Topic",
]

[project.scripts]
payment-log = "payment_log.cli:main"

[tool.setuptools.packages.find]
include = ["payment_log*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
